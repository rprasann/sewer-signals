[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sewer-surveillance"
version = "1.0.0"
description = "Attention-based outbreak forecasting with COVID-19 wastewater data"
readme = "README.md"
license = { text = "MIT" }
keywords = ["wastewater", "epidemiology", "forecasting", "TFT", "COVID-19", "public-health"]
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "neuralforecast>=1.7.4",
    "lightning>=2.2.0",

    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",

    # Visualization & Dashboard
    "plotly>=5.20.0",
    "dash>=2.16.0",
    "dash-bootstrap-components>=1.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",

    # Anthropic (LLM reporting)
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src"]  

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
