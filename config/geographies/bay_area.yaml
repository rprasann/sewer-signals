# Bay Area geography configuration
# =================================
# 9-county San Francisco Bay Area, CA  (FIPS prefix 06)
# Data: CA Wastewater Surveillance CSV + CA Statewide Cases/Deaths/Tests CSV
# Both CSVs cover all CA counties — no new files needed when switching regions.

name: "SF Bay Area"
shortname: "bay_area"

# county_name must exactly match the "County" column in the CA WW CSV
counties:
  Alameda:       "06001"
  "Contra Costa": "06013"
  Marin:         "06041"
  Napa:          "06055"
  "San Francisco": "06075"
  "San Mateo":   "06081"
  "Santa Clara": "06085"
  Solano:        "06095"
  Sonoma:        "06097"

# 2020 US Census county populations (fallback when population_served absent from raw data)
populations:
  "06001": 1682353   # Alameda
  "06013": 1165927   # Contra Costa
  "06041": 258826    # Marin
  "06055": 136484    # Napa
  "06075": 873965    # San Francisco
  "06081": 764442    # San Mateo
  "06085": 1936259   # Santa Clara
  "06095": 447643    # Solano
  "06097": 488863    # Sonoma

# Validation set — 3-county spatial-temporal synchrony benchmark
# Used by --counties validation shorthand
validation_counties: ["06075", "06081", "06085"]   # SF, San Mateo, Santa Clara

# FIPS with insufficient WW history to support a reliable RobustScaler fit.
# These counties are included at inference (quiet prior) but skipped at training.
# Napa + Solano joined the solid track 2–3 weeks before the first CV cutoff.
exclude_fips: []   # IQR floor (SCALER_IQR_FLOOR=0.3) now handles sparse counties

# ── Data availability window ──────────────────────────────────────────────────
# Full CA dataset window; solid-track WW data is available across this range.
data_start_date: "2020-07-01"
data_end_date:   "2023-12-19"

# ── CV split boundaries ───────────────────────────────────────────────────────
# train_end_date = first CV cutoff:
#   chosen AFTER the last county joined the solid WW track (Napa: 2022-09-26).
#   From DATA_START_DATE to this date ≈ 117 W-WED weeks >> INPUT_SIZE+H = 34.
# val_end_date   = last expanding-window CV cutoff (~35 W-WED beyond first).
#
# IMPORTANT: Verify these dates before running a new geography by checking
# that every county in your `counties` list has ≥ INPUT_SIZE+H = 34 weeks
# of solid-track WW data before train_end_date.
train_end_date: "2022-10-05"
val_end_date:   "2023-06-07"

# ── Dashboard map ─────────────────────────────────────────────────────────────
map_center_lat: 37.7
map_center_lon: -122.2
map_zoom: 7.8

# County centroids for the bubble map (lat, lon)
centroids:
  "06001": [37.6017, -121.7195]   # Alameda
  "06013": [37.9147, -121.9235]   # Contra Costa
  "06041": [38.0834, -122.7633]   # Marin
  "06055": [38.5025, -122.2654]   # Napa
  "06075": [37.7749, -122.4194]   # San Francisco
  "06081": [37.4350, -122.3185]   # San Mateo
  "06085": [37.3328, -121.8956]   # Santa Clara
  "06095": [38.2494, -121.9018]   # Solano
  "06097": [38.5780, -122.8759]   # Sonoma

# ── Outbreak validation windows (for --outbreak-validation flag) ──────────────
# Named historical outbreak episodes used to test OutbreakClassifier sensitivity.
outbreak_validation_windows:
  - name: "Winter 2020-21"
    eval_start: "2020-11-18"
    eval_end:   "2021-01-20"
    counties:   ["06075", "06081", "06085"]
  - name: "Delta 2021"
    eval_start: "2021-07-28"
    eval_end:   "2021-09-22"
    counties:   ["06075", "06081", "06085"]
  - name: "Omicron BA.1"
    eval_start: "2021-12-15"
    eval_end:   "2022-02-23"
    counties:   ["06075", "06081", "06085"]
  - name: "XBB.1.5 Onset"
    eval_start: "2022-12-14"
    eval_end:   "2023-01-25"
    counties:   null   # all counties
